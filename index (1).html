<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5f1">
<title>사이로그 — 연애 러닝메이트</title>
<style>
:root{--ink:#302d3d;--muted:#817d89;--paper:#f8f5f1;--white:#fff;--line:#ece7e3;--purple:#7669a6;--deep:#584e81;--lav:#efebf6;--rose:#f3e5e0;--shadow:0 12px 34px #34295012}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:70px;position:sticky;top:0;z-index:5;background:#f8f5f1eF;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 1120px)/2))}.brand{display:flex;gap:10px;align-items:center;border:0;background:none;color:var(--ink);text-align:left}.logo{width:39px;height:39px;display:grid;place-items:center;border-radius:14px;background:var(--purple);color:#fff;font-size:20px}.brand b{font-size:18px;letter-spacing:-.04em}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:-3px}.local{color:#716c7c;background:#eeece8;padding:6px 11px;border-radius:99px;font-size:11px}.layout{max-width:1120px;margin:auto;padding:32px 20px 70px;display:grid;grid-template-columns:190px minmax(0,1fr);gap:36px}.side{position:sticky;top:100px;height:max-content}.side small{letter-spacing:.12em;color:#a39eaa;font-size:10px;font-weight:800;padding:0 12px}.nav{margin-top:10px;display:grid;gap:4px}.nav button{border:0;background:none;color:var(--muted);text-align:left;padding:11px 12px;border-radius:13px;font-weight:650}.nav button.active,.nav button:hover{background:var(--lav);color:var(--deep)}.side-note{margin-top:30px;padding:15px;background:#f0ece7;border-radius:16px;color:var(--muted);font-size:11px}.side-note b{display:block;color:#514c5a;font-size:12px;margin-bottom:3px}.main{min-width:0}.hidden{display:none!important}.eyebrow{font-size:10px;letter-spacing:.13em;color:var(--purple);font-weight:800}.title{font-size:29px;line-height:1.25;letter-spacing:-.05em;margin:7px 0}.lead{color:var(--muted);font-size:13px;margin:0}.hero{background:#eae4f1;border-radius:24px;padding:31px;position:relative;overflow:hidden;margin-bottom:18px}.hero:after{content:"♡";position:absolute;right:12px;bottom:-55px;color:#7669a614;font:180px Georgia}.hero>div{position:relative;z-index:1;max-width:500px}.hero h1{font-size:29px;line-height:1.35;letter-spacing:-.05em;margin:9px 0}.hero p{color:#6f6980;font-size:13px;margin:0}.actions{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:750}.primary{background:var(--purple);color:white}.primary:hover{background:var(--deep)}.secondary{background:#fff;color:var(--deep)}.quiet{background:none;color:var(--muted)}.danger{background:#f8e9e5;color:#a05050}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 3px 14px #302d3d05}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.card h2{font-size:15px;margin:0;letter-spacing:-.02em}.card-head p{font-size:11px;color:var(--muted);margin:3px 0 0}.link{border:0;background:none;color:var(--purple);font-size:11px;font-weight:750}.profile-box{background:#f6f3f8;border-radius:15px;padding:15px}.badge{font-size:10px;color:var(--deep);background:#e9e3f2;padding:5px 8px;border-radius:99px}.meter{display:grid;grid-template-columns:75px 1fr 26px;gap:8px;align-items:center;font-size:10px;color:var(--muted);margin-top:13px}.bar{height:6px;background:#e4e0e8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#978abb;border-radius:99px}.section{margin-top:18px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mode{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 10px;text-align:left;color:inherit}.mode:hover,.mode.active{background:#f7f4fa;border-color:#c9bfdb}.mode strong{display:block;font-size:12px}.mode span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.mode em{display:block;font-style:normal;font-size:18px;margin-bottom:4px;color:var(--purple)}.empty{padding:25px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--muted);font-size:12px}.record{display:grid;grid-template-columns:76px 1fr 18px;gap:11px;padding:14px 0;border-bottom:1px solid #f1edeb;align-items:start}.date{font-size:10px;color:var(--muted)}.date b{display:block;color:#55515e;font-size:12px}.record strong{font-size:12px}.record p{font-size:11px;color:var(--muted);margin:3px 0}.tag{display:inline-block;background:#f1edf6;color:#746992;border-radius:99px;padding:3px 7px;font-size:9px}.open{border:0;background:none;color:#aaa;font-size:19px}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:white;color:var(--muted);font-size:11px;padding:7px 11px}.filter.active{background:var(--lav);color:var(--deep)}.chatbox{border:1px solid var(--line);border-radius:20px;background:#fff;overflow:hidden;margin-top:18px}.chathead{display:flex;justify-content:space-between;padding:14px 17px;border-bottom:1px solid var(--line);align-items:center}.chathead b{font-size:12px}.chathead small{display:block;color:var(--muted);font-size:10px}.demo{font-size:9px;color:#81796d;background:#f3f0eb;padding:5px 8px;border-radius:99px}.messages{height:330px;overflow:auto;background:#fdfcfb;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;display:flex;align-items:end;gap:7px}.msg.user{align-self:flex-end;flex-direction:row-reverse}.bubble{padding:10px 13px;background:#efedf3;border-radius:15px 15px 15px 4px;color:#4c4857;font-size:12px;white-space:pre-wrap}.user .bubble{background:var(--purple);color:#fff;border-radius:15px 15px 4px 15px}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}textarea,.field{width:100%;border:1px solid var(--line);border-radius:12px;background:#fcfbfa;padding:11px 12px;color:var(--ink)}textarea{resize:vertical;min-height:45px;max-height:120px;font-size:12px}.send{width:45px;border:0;background:var(--purple);color:#fff;border-radius:12px;font-size:18px}.save-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;color:var(--muted);padding:12px}.save-row label{display:flex;align-items:center;gap:6px}.save-row input{accent-color:var(--purple)}.quiz{max-width:690px;margin:30px auto;padding:0 18px 60px}.quizcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:27px;box-shadow:var(--shadow)}.qtitle{font-size:23px;line-height:1.4;letter-spacing:-.04em;margin:9px 0}.qhint{font-size:12px;color:var(--muted)}.options{display:grid;gap:8px;margin-top:15px}.option{border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;gap:10px;font-size:12px;cursor:pointer}.option:has(input:checked){border-color:#bcaed4;background:#f8f5fb}.option input{accent-color:var(--purple)}.progress{height:5px;background:#eeeaf0;border-radius:99px;margin:18px 0}.progress i{display:block;height:100%;background:var(--purple);border-radius:99px}.qactions{display:flex;justify-content:space-between;margin-top:20px}.field-label{font-weight:750;font-size:11px;display:block;margin:14px 0 6px}.small{font-size:10px;line-height:1.6;color:#96909a}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.insight{padding:18px;background:linear-gradient(120deg,#f0ebf6,#f7eee9);border-radius:17px;color:#625c6e;font-size:12px;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:#faf9f8;border-radius:13px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:#211b2d66;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:20px;width:min(540px,100%);max-height:85vh;overflow:auto;padding:21px}.modal-top{display:flex;justify-content:space-between}.modal h2{font-size:19px;margin:5px 0}.mobile{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#393546;color:white;border-radius:99px;padding:10px 16px;font-size:11px;z-index:40}.foot{font-size:10px;color:#a09aa3;text-align:center;margin:22px 0 0;line-height:1.6}
@media(max-width:800px){.layout{display:block;padding:22px 14px 90px}.side{display:none}.top{height:62px;padding:0 14px}.local{display:none}.mobile{display:flex;position:fixed;z-index:10;bottom:0;left:0;right:0;padding:6px 4px max(6px,env(safe-area-inset-bottom));justify-content:space-around;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line)}.mobile button{display:grid;justify-items:center;gap:1px;font-size:9px;padding:5px 9px}.mobile button span:first-child{font-size:17px}.grid{grid-template-columns:1fr}.hero{padding:25px 20px}.hero h1{font-size:25px}.modes{grid-template-columns:repeat(2,1fr)}.title{font-size:26px}.quiz{margin:20px auto}.quizcard{padding:21px}}
</style>
</head>
<body>
<header class="top"><button class="brand" onclick="go('home')"><span class="logo">♡</span><span><b>사이로그</b><small>연애 러닝메이트</small></span></button><span class="local">🔒 기록은 이 브라우저에만 저장돼요</span></header>
<div id="quiz" class="quiz"></div>
<div id="app" class="layout hidden"><aside class="side"><small>MY SPACE</small><nav class="nav" id="nav"></nav><div class="side-note"><b>천천히, 내 속도로</b>정답을 찾기보다 내 마음과 관계의 흐름을 알아가요.</div></aside><main class="main" id="main"></main></div><nav class="mobile hidden" id="mobile"></nav><div id="modal"></div><div id="toast"></div>
<script>
const STORE='dudgeoreum-v1';
const navs=[['home','⌂','홈'],['chat','✳','상담하기'],['records','▤','내 기록'],['insights','◌','돌아보기'],['profile','◎','내 프로필']];
const qs=[
['관계가 괜찮은지 확신하기 어려우면 걱정이 커지는 편인가요?','예: 답장이 늦거나 평소와 다르게 느껴질 때','a'],
['상대에게 내 마음을 확인받고 싶을 때가 자주 있나요?','','a'],
['갈등이 생기면 관계가 끝날까 봐 크게 불안해지나요?','','a'],
['상대의 작은 말이나 행동을 오래 곱씹는 편인가요?','','a'],
['속상한 일이 있어도 말하기보다 혼자 넘기는 편인가요?','','v'],
['누군가와 가까워질수록 내 공간이 줄어드는 느낌이 드나요?','','v'],
['의지하거나 도움을 부탁하는 일이 어색하고 어렵나요?','','v'],
['감정을 나누는 대화가 부담스러워 피하고 싶을 때가 있나요?','','v']
];
let db=read(),q={step:0,answers:[],name:'',status:'연애 중',support:'공감받고 싶어요'},mode='공감받기',msgs=[],filter='전체';
function read(){try{return JSON.parse(localStorage.getItem(STORE))||{}}catch(e){return{}}}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function esc(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function notify(s){document.getElementById('toast').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',2200)}
function dstr(d){return new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric'}).format(new Date(d))}
function nav(){let h=navs.map(n=>'<button class="'+(db.view===n[0]?'active':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+'　'+n[2]+'</button>').join('');document.getElementById('nav').innerHTML=h;document.getElementById('mobile').innerHTML=navs.map(n=>'<button class="'+(db.view===n[0]?'active':'')+'" onclick="go(\''+n[0]+'\')"><span>'+n[1]+'</span><span>'+n[2]+'</span></button>').join('')}
function go(v){if(!db.profile){showQuiz();return}db.view=v;nav();render();window.scrollTo({top:0,behavior:'smooth'})}
function showQuiz(){document.getElementById('app').classList.add('hidden');document.getElementById('mobile').classList.add('hidden');let el=document.getElementById('quiz');el.classList.remove('hidden');let s=q.step;
if(s===0){el.innerHTML='<div class="eyebrow">RELATIONSHIP JOURNAL & AI COMPANION</div><div class="quizcard" style="margin-top:15px"><div style="font-size:27px;color:var(--purple)">♡</div><div class="eyebrow">내 연애의 흐름을 함께 걷는 곳</div><h1 class="qtitle" style="font-size:32px">연애에도,<br>나를 알아가는 시간이 필요하니까</h1><p class="qhint" style="line-height:1.8">처음에는 나의 관계 방식을 살펴보고, 그 뒤로는 고민과 감정을 기록하며 내 속도에 맞춰 대화를 이어가는 연애 러닝메이트예요.</p><div class="grid section"><div class="profile-box"><b>01 · 나를 소개하기</b><div class="small">관계에서의 감정과 대화 방식을 돌아봐요.</div></div><div class="profile-box"><b>02 · 마음 나누기</b><div class="small">공감, 정리, 조언 중 원하는 방식으로 이야기해요.</div></div></div><div class="section profile-box"><b>03 · 함께 돌아보기</b><div class="small">저장한 고민을 다시 보며 나의 관계 흐름을 살펴봐요.</div></div><div class="actions"><button class="btn primary" onclick="q.step=1;showQuiz()">나를 소개할게요 →</button><button class="btn secondary" onclick="skip()">둘러보기</button></div><p class="small section">이 질문은 자기이해를 위한 시제품용 점검이며 정식 심리검사나 진단이 아니에요. 기록은 현재 브라우저에만 저장됩니다.</p></div>';return}
if(s===1){el.innerHTML='<div class="eyebrow">첫 만남 · 기본 정보</div><div class="quizcard section"><h1 class="qtitle">어떤 이름으로 불러드릴까요?</h1><p class="qhint">닉네임이나 이름을 적어주세요. 비워두어도 괜찮아요.</p><input id="name" class="field" maxlength="16" placeholder="예: 서은" value="'+esc(q.name)+'"><div class="row"><div><label class="field-label">지금의 관계 상태</label><select id="status" class="field">'+['연애 중','썸·호감 관계','솔로','이별 후'].map(x=>'<option '+(q.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div><label class="field-label">선호하는 도움</label><select id="support" class="field">'+['공감받고 싶어요','상황을 정리하고 싶어요','조언을 듣고 싶어요','보낼 말을 같이 만들고 싶어요'].map(x=>'<option '+(q.support===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="qactions"><button class="btn secondary" onclick="q.step=0;showQuiz()">이전</button><button class="btn primary" onclick="basics()">계속 →</button></div></div>';return}
if(s>=2&&s<10){let i=s-2,item=qs[i],opts=['거의 그렇지 않아요','가끔 그래요','자주 그래요','거의 늘 그래요'];el.innerHTML='<div class="eyebrow">첫 만남 · 관계 방식 돌아보기</div><div class="quizcard section"><div class="eyebrow">QUESTION '+String(i+1).padStart(2,'0')+' / 08</div><div class="progress"><i style="width:'+(i/8*100)+'%"></i></div><h1 class="qtitle">'+item[0]+'</h1><p class="qhint">'+(item[1]||'최근의 관계 경험을 떠올리며 답해보세요. 정답은 없어요.')+'</p><div class="options">'+opts.map((x,j)=>'<label class="option"><input type="radio" name="answer" value="'+j+'" '+(q.answers[i]===j?'checked':'')+'><span>'+x+'</span></label>').join('')+'</div><div class="qactions"><button class="btn secondary" onclick="q.step--;showQuiz()">이전</button><button class="btn primary" onclick="nextQ()">'+(i===7?'결과 보기':'다음 →')+'</button></div><p class="small">관계 경험과 상황에 따라 달라질 수 있어요. 결과는 유형을 확정하지 않고 상담의 참고자료로만 사용됩니다.</p></div>';return}
if(s===10){let z=scores(),r=result(z);el.innerHTML='<div class="eyebrow">YOUR RELATIONSHIP MAP</div><div class="quizcard section"><div class="eyebrow">나의 관계 프로필</div><h1 class="qtitle">'+r.title+'</h1><p class="qhint">'+esc(q.name||'당신')+'의 답변에서 보이는 경향을 정리했어요. 성격을 규정하거나 진단하는 결과가 아니에요.</p><div class="profile-box section"><b>관계에서 불안해지는 정도 · '+r.al+'</b><p class="small">'+r.a+'</p>'+meter('불안 신호',z.a)+'</div><div class="profile-box section"><b>가까워질 때 거리감이 필요한 정도 · '+r.v+'</b><p class="small">'+r.vt+'</p>'+meter('거리 필요',z.v)+'</div><p class="small section">이 프로필은 대화의 참고자료예요. 지금의 나와 맞지 않으면 언제든 다시 살펴볼 수 있어요.</p><div class="qactions"><button class="btn secondary" onclick="q.step=9;showQuiz()">답변 수정</button><button class="btn primary" onclick="finish()">사이로그 시작하기 →</button></div></div>';return}
}
function basics(){q.name=document.getElementById('name').value.trim();q.status=document.getElementById('status').value;q.support=document.getElementById('support').value;q.step=2;showQuiz()}
function nextQ(){let a=document.querySelector('input[name=answer]:checked');if(!a){notify('가장 가까운 답을 골라주세요');return}q.answers[q.step-2]=Number(a.value);q.step=q.step===9?10:q.step+1;showQuiz()}
function scores(){let a=q.answers.slice(0,4).reduce((x,y)=>x+y,0)/4+1,v=q.answers.slice(4,8).reduce((x,y)=>x+y,0)/4+1;return{a:Math.round(a*10)/10,v:Math.round(v*10)/10}}
function result(z){return{title:z.a<2.6&&z.v<2.6?'편안한 연결을 만들어가는 편':z.a>=2.6&&z.v<2.6?'확인과 연결을 중요하게 여기는 편':z.a<2.6?'혼자 정리할 공간이 필요한 편':'가까움과 거리 사이에서 고민하는 편',al:z.a>=2.6?'살펴볼 만한 편':'차분한 편',a:z.a>=2.6?'상대의 반응이 모호할 때 마음이 바빠지거나 관계가 괜찮은지 확인하고 싶어질 수 있어요.':'상대의 반응이 달라져도 비교적 차분하게 상황을 살펴보는 편으로 보여요.',v:z.v>=2.6?'마음이 복잡할 때 혼자 생각할 시간이나 감정을 표현할 준비가 필요할 수 있어요.':'감정을 나누고 도움을 주고받는 일이 비교적 편안한 편으로 보여요.'}}
function meter(label,n){return'<div class="meter"><span>'+label+'</span><div class="bar"><i style="width:'+(n*25)+'%"></i></div><span>'+n.toFixed(1)+'</span></div>'}
function finish(){let z=scores(),r=result(z);db.profile={name:q.name||'나',status:q.status,support:q.support,a:z.a,v:z.v,title:r.title};db.records=[];db.view='home';save();renderApp();notify('나의 연애 프로필을 만들었어요')}
function skip(){db.profile={name:'나',status:'연애 중',support:'공감받고 싶어요',a:2,v:2,title:'천천히 나를 알아가는 중'};db.records=[];db.view='home';save();renderApp()}
function renderApp(){document.getElementById('quiz').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('mobile').classList.remove('hidden');nav();render()}
function render(){if(!db.profile)return;let v=db.view||'home';document.getElementById('main').innerHTML=v==='home'?home():v==='chat'?chatView():v==='records'?records():v==='insights'?insights():profile()}
function home(){let p=db.profile,r=(db.records||[]).slice(0,3);return'<section><div class="hero"><div><div class="eyebrow">YOUR RELATIONSHIP JOURNEY</div><h1>'+esc(p.name)+'님, 오늘 마음은 어떤가요?</h1><p>괜찮은 척하지 않아도 돼요. 원하는 방식으로 마음을 나눠봐요.</p><div class="actions"><button class="btn primary" onclick="startChat()">마음 나누기 →</button><button class="btn secondary" onclick="go(\'records\')">내 기록 보기</button></div></div></div><div class="grid"><section class="card"><div class="card-head"><div><h2>최근의 마음 기록</h2><p>저장한 상담을 다시 볼 수 있어요.</p></div><button class="link" onclick="go(\'records\')">전체 보기 →</button></div>'+(r.length?r.map(row).join(''):'<div class="empty">♡<br>첫 상담을 나누면 여기에 기록이 쌓여요.</div>')+'</section><section class="card"><div class="card-head"><div><h2>나의 연애 프로필</h2><p>상담에 참고하는 나의 관계 지도</p></div><button class="link" onclick="go(\'profile\')">자세히 →</button></div><div class="profile-box"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+esc(p.title)+'</b><span class="badge">'+esc(p.status)+'</span></div>'+meter('불안 신호',p.a)+meter('거리 필요',p.v)+'</div><p class="small">검사 결과는 고정된 유형이 아닌 자기이해 자료예요.</p></section></div><section class="card section"><div class="card-head"><div><h2>지금 필요한 대화는?</h2><p>원하는 도움을 선택해 이야기를 시작해요.</p></div></div>'+modeCards()+'</section><p class="foot">사이로그는 자기이해와 대화를 돕는 시제품입니다. 기록은 이 브라우저에 저장됩니다.</p></section>'}
const modes=[['공감받기','마음이 힘들 때','♡'],['상황 정리','사실과 생각 나누기','☷'],['조언 듣기','다음 한 걸음 찾기','✦'],['말 다듬기','마음을 전할 문장','✎']];
function modeCards(){return'<div class="modes">'+modes.map(m=>'<button class="mode '+(mode===m[0]?'active':'')+'" onclick="startChat(\''+m[0]+'\')"><em>'+m[2]+'</em><strong>'+m[0]+'</strong><span>'+m[1]+'</span></button>').join('')+'</div>'}
function startChat(m){if(m)mode=m;msgs=[];go('chat')}
function chatView(){let hello=mode==='공감받기'?'지금 마음에 가장 크게 남아 있는 일을 편한 만큼 이야기해 주세요.':mode==='상황 정리'?'무슨 일이 있었는지, 그때 어떤 생각이 들었는지 같이 천천히 나눠봐요.':mode==='조언 듣기'?'어떤 선택 앞에서 고민하고 있나요? 함께 다음 한 걸음을 찾아볼게요.':'전하고 싶은 말이나 상황을 알려주세요. 내 마음이 잘 드러나도록 같이 다듬어볼게요.';return'<div class="eyebrow">YOUR PRIVATE CONVERSATION</div><h1 class="title">마음 나누기</h1><p class="lead">원하는 방식으로 이야기해요. 정답을 서두르지 않을게요.</p><div class="section">'+modeCards()+'</div><div class="chatbox"><div class="chathead"><span><b>♡ 사이로그 러닝메이트</b><small>'+esc(db.profile.title)+' · '+mode+'</small></span><span class="demo">시제품 상담</span></div><div id="messages" class="messages">'+(msgs.length?msgs.map(bubble).join(''):'<div class="msg"><div class="bubble">'+hello+'</div></div>')+'</div><div class="compose"><textarea id="text" placeholder="지금 마음에 걸리는 일을 적어주세요…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button class="send" onclick="send()">↑</button></div>'+(msgs.some(m=>m.role==="user")?'<div class="save-row"><label><input id="consent" type="checkbox" checked> 상담 내용을 내 기록에 저장할게요</label><button class="btn primary" onclick="saveChat()">기록 저장</button></div>':'')+'</div><p class="foot">시제품은 외부 AI 서버에 연결되지 않고, 미리 구성된 응답 예시를 바탕으로 작동해요. 입력 내용은 브라우저 밖으로 전송되지 않습니다.</p>'}
function bubble(m){return'<div class="msg '+(m.role==='user'?'user':'')+'"><div class="bubble">'+esc(m.text)+'</div></div>'}
function send(){let el=document.getElementById('text'),t=el.value.trim();if(!t){notify('마음에 있는 이야기를 적어주세요');return}msgs.push({role:'user',text:t});let danger=/폭력|때렸|협박|강요|무서워|스토킹|감금|통제|다치게|자해|죽고 싶/.test(t);let topic=/답장|연락|읽씹|잠수/.test(t)?'연락과 불안':/싸웠|다퉜|갈등|서운/.test(t)?'갈등과 대화':/헤어|이별|끝내/.test(t)?'이별과 선택':/고백|썸/.test(t)?'호감과 관계 시작':danger?'안전과 경계':'마음이 복잡해요';let a=danger?'그런 일을 겪고 있다면 혼자 감당하지 않아도 돼요. 지금 위험하다면 상대와 거리를 두고 안전한 장소로 이동한 뒤, 믿을 수 있는 사람이나 긴급 지원기관에 연락해 주세요. 관계의 결론보다 당신의 안전과 선택권이 먼저예요. 지금 안전한 곳에 있나요?':mode==='공감받기'?'그 일이 마음에 오래 남았겠어요. '+(db.profile.a>=2.6?'상대의 반응이 불확실할 때 걱정이 커지는 편이라고 알려주셨는데, 이번에도 그 불확실함이 특히 힘들었을 수 있겠네요. ':'')+'지금 당장 해결책을 정하지 않아도 괜찮아요. 가장 속상했던 부분을 조금 더 이야기해줄래요?':mode==='상황 정리'?'지금 적어준 내용에는 실제로 있었던 일과 그 일에 대한 걱정이 함께 들어 있을 수 있어요. 확인된 사실과 아직 확인되지 않은 부분을 나눠볼까요? 마음속에서 가장 걱정되는 해석은 무엇인가요?':mode==='조언 듣기'?'먼저 상대에게 바라는 점을 한 문장으로 정리해보면 좋겠어요. 그 말을 전하기에 안전하고 편안한 순간을 골라보세요. 어떤 결과가 나오면 당신에게 가장 괜찮을까요?':'“'+t.slice(0,55)+(t.length>55?'…':'')+' 때문에 나는 조금 속상하고 걱정됐어. 다음에는 내 마음을 차분히 나누고 싶어. 네 생각도 듣고 싶어.”\n\n실제로 보내기 전, 당신 말투에 맞게 편하게 고쳐보세요.';msgs.push({role:'assistant',text:a,topic:topic});render();let box=document.getElementById('messages');box.scrollTop=box.scrollHeight}
function saveChat(){if(!msgs.some(m=>m.role==='user')){notify('먼저 고민을 나눠주세요');return}let consent=document.getElementById('consent');if(consent&&!consent.checked){notify('기록 저장을 선택하지 않았어요');return}let question=msgs.filter(m=>m.role==='user').map(m=>m.text).join('\n');let answer=msgs.filter(m=>m.role==='assistant').map(m=>m.text).join('\n\n');db.records=db.records||[];db.records.unshift({id:String(Date.now()),date:new Date().toISOString(),title:question.length>30?question.slice(0,30)+'…':question,topic:msgs.find(m=>m.topic)?.topic||'마음이 복잡해요',mode:mode,question:question,answer:answer,note:'',next:''});save();notify('오늘의 상담을 기록했어요');go('records')}
function row(r){return'<button class="record" style="width:100%;text-align:left;background:none;border:0;color:inherit" onclick="openRec(\''+r.id+'\')"><span class="date"><b>'+dstr(r.date)+'</b>상담 기록</span><span><strong>'+esc(r.title)+'</strong><p>'+esc(r.topic)+' · '+esc(r.mode)+'</p></span><span class="open">›</span></button>'}
function records(){let rs=db.records||[],topics=['전체','연락과 불안','갈등과 대화','이별과 선택','호감과 관계 시작','안전과 경계','마음이 복잡해요'];let filtered=rs.filter(r=>filter==='전체'||r.topic===filter);return'<div class="eyebrow">YOUR JOURNAL</div><h1 class="title">내 기록</h1><p class="lead">나눈 이야기가 쌓여 나의 관계 흐름을 돌아볼 수 있어요.</p><div class="tabs">'+topics.map(x=>'<button class="filter '+(x===filter?'active':'')+'" onclick="filter=\''+x+'\';render()">'+x+'</button>').join('')+'</div><section class="card">'+(filtered.length?filtered.map(row).join(''):'<div class="empty">♡<br>'+(rs.length?'이 주제의 기록은 아직 없어요.':'아직 저장한 기록이 없어요.')+'<div style="margin-top:12px"><button class="btn primary" onclick="startChat()">첫 상담 시작하기</button></div></div>')+'</section><p class="foot">기록은 이 브라우저에만 저장돼요. 다른 기기와 동기화되지 않습니다.</p>'}
function insights(){let rs=db.records||[],counts={};rs.forEach(r=>counts[r.topic]=(counts[r.topic]||0)+1);let sort=Object.entries(counts).sort((a,b)=>b[1]-a[1]);let msg=rs.length===0?'첫 기록을 남기면 자주 마음에 남는 주제와 도움이 된 대화 방식을 함께 돌아볼게요.':rs.length<3?'지금까지 '+rs.length+'개의 이야기를 기록했어요. 조금 더 쌓이면 반복되는 상황을 조심스럽게 살펴볼 수 있어요.':'기록에서 ‘'+sort[0][0]+'’ 이야기가 '+sort[0][1]+'번 나왔어요. 요즘 이 주제가 자주 마음에 머무는지 함께 살펴봐요.';return'<div class="eyebrow">LOOKING BACK WITH KINDNESS</div><h1 class="title">우리의 흐름 돌아보기</h1><p class="lead">기록 속에서 반복되는 주제와 도움이 된 순간을 찾아봐요.</p><div class="insight section">'+msg+'</div><section class="card section"><h2>나의 기록 흐름</h2><div class="stats"><div class="stat"><b>'+rs.length+'</b><span>저장한 상담</span></div><div class="stat"><b>'+(sort[0]?sort[0][1]:0)+'</b><span>자주 나온 주제</span></div><div class="stat"><b>'+new Set(rs.map(r=>r.mode)).size+'</b><span>시도한 대화 방식</span></div></div>'+(sort.length?'<div class="section"><b style="font-size:12px">마음에 자주 남은 주제</b>'+sort.slice(0,4).map(x=>meter(x[0],Math.min(4,x[1]))).join('')+'</div>':'')+'</section><p class="small section">기록이 적을 때는 패턴이 실제보다 크게 보일 수 있어요. 이 화면은 진단이나 관계의 결론을 제공하지 않습니다.</p>'}
function profile(){let p=db.profile;return'<div class="eyebrow">YOUR RELATIONSHIP MAP</div><h1 class="title">나의 연애 프로필</h1><p class="lead">지금의 나와 달라진 부분을 언제든 수정할 수 있어요.</p><div class="grid section"><section class="card"><h2>나를 소개해요</h2><label class="field-label">이름 또는 닉네임</label><input id="pname" class="field" value="'+esc(p.name)+'"><label class="field-label">현재의 관계 상태</label><select id="pstatus" class="field">'+['연애 중','썸·호감 관계','솔로','이별 후'].map(x=>'<option '+(p.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label class="field-label">선호하는 도움</label><select id="psupport" class="field">'+['공감받고 싶어요','상황을 정리하고 싶어요','조언을 듣고 싶어요','보낼 말을 같이 만들고 싶어요'].map(x=>'<option '+(p.support===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="btn primary section" onclick="updateProfile()">변경사항 저장</button></section><section class="card"><h2>관계 방식 돌아보기</h2><div class="profile-box section"><b>'+esc(p.title)+'</b>'+meter('불안 신호',p.a)+meter('거리 필요',p.v)+'</div><p class="small section">이 문항은 정식 심리검사를 그대로 사용하지 않은 시제품용 자기성찰 질문입니다. 결과는 진단이 아니며 상황에 따라 달라질 수 있어요.</p><button class="btn secondary section" onclick="restartQuiz()">관계 방식 다시 살펴보기</button></section></div><section class="card section"><h2>기록과 개인정보</h2><p class="small">프로필과 상담 기록은 현재 브라우저 저장 공간에만 보관됩니다. 브라우저 데이터를 지우거나 다른 기기를 쓰면 기록이 사라질 수 있어요.</p><button class="btn danger section" onclick="clearAll()">내 데이터 모두 지우기</button></section><p class="foot">사이로그는 자기이해와 대화를 돕는 시제품이며 전문 상담이나 위기 지원을 대신하지 않아요.</p>'}
function updateProfile(){db.profile.name=document.getElementById('pname').value.trim()||'나';db.profile.status=document.getElementById('pstatus').value;db.profile.support=document.getElementById('psupport').value;save();renderApp();notify('프로필을 저장했어요')}
function restartQuiz(){if(!confirm('관계 방식 점검을 다시 시작할까요?'))return;q={step:0,answers:[],name:db.profile.name,status:db.profile.status,support:db.profile.support};showQuiz()}
function clearAll(){if(!confirm('프로필과 상담 기록을 모두 삭제할까요? 되돌릴 수 없어요.'))return;localStorage.removeItem(STORE);db={};q={step:0,answers:[],name:'',status:'연애 중',support:'공감받고 싶어요'};showQuiz();notify('데이터를 모두 지웠어요')}
function openRec(id){let r=db.records.find(x=>x.id===id);if(!r)return;document.getElementById('modal').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-top"><div><div class="eyebrow">'+dstr(r.date)+' · '+esc(r.topic)+'</div><h2>'+esc(r.title)+'</h2></div><button class="btn secondary" onclick="closeModal()">닫기</button></div><p class="small" style="white-space:pre-wrap"><b>내가 나눈 이야기</b><br>'+esc(r.question)+'<br><br><b>함께 정리한 답변</b><br>'+esc(r.answer)+'</p><label class="field-label">나중에 덧붙일 메모</label><textarea id="note" class="field">'+esc(r.note)+'</textarea><label class="field-label">다음에 해볼 작은 행동</label><input id="next" class="field" value="'+esc(r.next)+'" placeholder="예: 차분할 때 내 마음 전하기"><div class="actions" style="justify-content:flex-end"><button class="btn danger" onclick="delRec(\''+r.id+'\')">기록 삭제</button><button class="btn primary" onclick="saveRec(\''+r.id+'\')">메모 저장</button></div></div></div>'}
function saveRec(id){let r=db.records.find(x=>x.id===id);r.note=document.getElementById('note').value;r.next=document.getElementById('next').value;save();closeModal();render();notify('기록을 업데이트했어요')}
function delRec(id){if(!confirm('이 상담 기록을 삭제할까요?'))return;db.records=db.records.filter(x=>x.id!==id);save();closeModal();render();notify('기록을 삭제했어요')}
function closeModal(){document.getElementById('modal').innerHTML=''}
if(db.profile){db.records=db.records||[];renderApp()}else showQuiz();
</script>
</body></html>
